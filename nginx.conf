server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # (add_header só no nível do server: dentro de "location" ele substituiria os daqui)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # app e service worker: sempre revalidar (versão nova chega na hora)
    location = /index.html           { expires -1; }
    location = /sw.js                { expires -1; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires -1; }
    location ~* \.png$               { expires 7d; }

    location / { try_files $uri $uri/ /index.html; }
}
